[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-tensordex"
version = "0.0.1"
description = "hf CLI extension: store models in your Hugging Face bucket with TensorDex tensor-level dedup and delta compression, transparently"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    # published as GitHub release assets of this repo (see README); PyPI later
    "tensordex-client>=0.0.1",
    "tensordex-common>=0.0.1",
    "tensordex-decode>=0.0.1",
    "huggingface_hub>=1.0",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
hf-tensordex = "hf_tensordex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
